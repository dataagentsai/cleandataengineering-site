<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-label="Two people at a whiteboard sketching a flow of connected boxes, with a lightbulb above them.">
  <title>Building it together</title>
  <defs>
    <style>
      .o { stroke:#1E1B3A; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
      .t { fill:none; stroke:#1E1B3A; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <!-- soft background blobs -->
  <path d="M40,250 C20,140 120,60 250,70 C380,80 420,30 510,90 C600,150 590,300 520,360 C440,430 300,420 200,400 C100,380 55,330 40,250 Z" fill="#C9F2E3"/>
  <path d="M90,300 C70,220 150,170 260,175 C370,180 470,170 520,240 C560,300 520,380 420,395 C320,410 190,405 130,375 C100,360 95,330 90,300 Z" fill="#FBE6DA"/>

  <!-- lightbulb -->
  <g transform="translate(470,40)">
    <g class="t" style="stroke:#F2A93B;stroke-width:4">
      <line x1="0" y1="-26" x2="0" y2="-40"/><line x1="-26" y1="-14" x2="-38" y2="-22"/><line x1="26" y1="-14" x2="38" y2="-22"/>
      <line x1="-30" y1="12" x2="-44" y2="14"/><line x1="30" y1="12" x2="44" y2="14"/>
    </g>
    <circle cx="0" cy="10" r="24" fill="#FFC94D" class="o"/>
    <path d="M-8,18 C-14,6 -4,0 0,8 C4,0 14,6 8,18" class="t"/>
    <rect x="-11" y="33" width="22" height="14" rx="4" fill="#3A3768" class="o"/>
  </g>

  <!-- whiteboard, slightly tilted -->
  <g transform="rotate(-3 300 210)">
    <rect x="175" y="105" width="270" height="200" rx="10" fill="#FFFFFF" class="o"/>
    <line x1="175" y1="128" x2="445" y2="128" class="t" style="stroke-width:1.6"/>
    <circle cx="420" cy="117" r="4" fill="#5B5FEF"/><circle cx="433" cy="117" r="4" fill="#5B5FEF"/>
    <!-- the sketched flow: boxes joined by lines -->
    <g class="t" style="stroke-width:2">
      <line x1="230" y1="190" x2="275" y2="225"/><line x1="303" y1="222" x2="335" y2="168"/><line x1="362" y1="166" x2="398" y2="196"/>
    </g>
    <rect x="207" y="170" width="38" height="30" rx="8" fill="#5B5FEF"/>
    <circle cx="290" cy="228" r="17" fill="#5B5FEF"/>
    <rect x="330" y="146" width="40" height="34" rx="9" fill="#5B5FEF"/>
    <circle cx="410" cy="206" r="20" fill="#5B5FEF"/>
    <g class="t" style="stroke-width:2"><line x1="205" y1="262" x2="300" y2="262"/><line x1="205" y1="278" x2="270" y2="278"/></g>
  </g>

  <!-- left person: yellow jumper, orange trousers -->
  <g>
    <path d="M118,440 L128,330 C130,315 200,315 205,330 L214,440 Z" fill="#FF7043" class="o"/>
    <path d="M100,330 C96,250 120,205 160,200 C200,198 222,240 222,300 C224,320 212,338 160,340 C120,342 102,340 100,330 Z" fill="#FFB547" class="o"/>
    <!-- arm reaching to the board -->
    <path d="M200,230 C232,222 252,214 262,206" fill="none" stroke="#FFB547" stroke-width="22" stroke-linecap="round"/>
    <path d="M200,230 C232,222 252,214 262,206" class="t" style="stroke-width:0"/>
    <circle cx="268" cy="204" r="11" fill="#F2A07B" class="o"/>
    <line x1="276" y1="200" x2="290" y2="194" class="t" style="stroke:#F2A07B;stroke-width:6"/>
    <!-- neck, head, hair -->
    <rect x="150" y="186" width="18" height="20" rx="6" fill="#F2A07B"/>
    <circle cx="160" cy="165" r="27" fill="#F2A07B" class="o"/>
    <path d="M134,160 C132,132 168,124 186,140 C190,148 188,156 184,158 C172,146 152,148 140,166 Z" fill="#26224D"/>
    <circle cx="128" cy="140" r="13" fill="#26224D"/>
    <circle cx="170" cy="165" r="2.4" fill="#1E1B3A"/><circle cx="182" cy="164" r="2.4" fill="#1E1B3A"/>
    <path d="M168,177 C174,183 182,182 186,176" class="t" style="stroke-width:2"/>
  </g>

  <!-- right person: green shirt, dark trousers, hand on hip -->
  <g>
    <path d="M400,440 L408,345 C410,332 488,332 492,345 L500,440 Z" fill="#2B2862" class="o"/>
    <path d="M384,350 C376,270 400,226 446,222 C496,220 520,262 516,330 C514,350 500,358 448,360 C404,362 386,360 384,350 Z" fill="#139477" class="o"/>
    <!-- arm with pen to the board -->
    <path d="M410,262 C380,250 362,238 352,224" fill="none" stroke="#139477" stroke-width="22" stroke-linecap="round"/>
    <circle cx="346" cy="220" r="11" fill="#B9673F" class="o"/>
    <line x1="342" y1="214" x2="318" y2="194" class="t" style="stroke:#1E1B3A;stroke-width:5"/>
    <!-- other arm on hip -->
    <path d="M508,272 C532,300 530,326 506,338" fill="none" stroke="#139477" stroke-width="20" stroke-linecap="round"/>
    <circle cx="500" cy="340" r="10" fill="#B9673F" class="o"/>
    <!-- neck, head, hair -->
    <rect x="438" y="206" width="18" height="20" rx="6" fill="#B9673F"/>
    <circle cx="447" cy="186" r="27" fill="#B9673F" class="o"/>
    <path d="M420,182 C416,152 452,146 470,160 C478,152 486,162 478,172 C470,166 444,160 428,186 Z" fill="#1E1B3A"/>
    <circle cx="434" cy="187" r="2.4" fill="#1E1B3A"/><circle cx="446" cy="186" r="2.4" fill="#1E1B3A"/>
    <path d="M430,199 C434,204 442,204 446,199" class="t" style="stroke-width:2"/>
  </g>
</svg>
