<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Line drawing of an engineer at a laptop; behind, a server stack and a screen showing a flow of boxes, with circuit lines, a plant and a cup of tea.">
  <title>An engineer and the harness</title>
  <defs>
    <style>
      .k { fill:none; stroke:#1E1E28; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .w { fill:#FFFFFF; stroke:#1E1E28; stroke-width:2; stroke-linejoin:round; }
      .b { fill:#4F6EF7; } .bl { fill:#E6EBFF; } .bk { fill:#1E1E28; }
    </style>
  </defs>

  <!-- soft wash behind, very pale -->
  <path d="M60,300 C40,180 140,110 300,120 C450,128 560,90 600,190 C630,270 580,360 470,380 C350,402 190,400 110,370 C80,356 64,330 60,300 Z" fill="#F1F4FB"/>

  <!-- desk line and shelf -->
  <path class="k" d="M30,408 L620,408"/>
  <path class="k" d="M40,212 L262,212"/>
  <path class="k" d="M470,250 L540,250 L540,282 L610,282 L610,408"/>

  <!-- server stack, top left -->
  <g>
    <rect class="w" x="80" y="46" width="140" height="38" rx="16"/><rect class="bl" x="98" y="60" width="78" height="10" rx="5"/><circle class="b" cx="200" cy="65" r="6"/>
    <rect class="w" x="80" y="88" width="140" height="38" rx="16"/><rect class="bl" x="98" y="102" width="78" height="10" rx="5"/><circle cx="200" cy="107" r="6" fill="#E6EBFF"/>
    <rect class="w" x="80" y="130" width="140" height="38" rx="16"/><rect class="bl" x="98" y="144" width="78" height="10" rx="5"/><circle cx="200" cy="149" r="6" fill="#E6EBFF"/>
    <rect class="w" x="80" y="172" width="140" height="38" rx="16"/><rect class="bl" x="98" y="186" width="78" height="10" rx="5"/><circle cx="200" cy="191" r="6" fill="#E6EBFF"/>
    <path class="k" d="M220,66 C260,66 270,120 300,140"/>
  </g>

  <!-- the screen on the shelf: the harness flow -->
  <g>
    <rect class="w" x="300" y="112" width="190" height="122" rx="6"/>
    <path class="k" d="M285,240 L505,240 L495,248 L295,248 Z"/>
    <rect x="316" y="128" width="40" height="22" rx="5" class="bl"/>
    <rect x="374" y="128" width="40" height="22" rx="5" class="b"/>
    <rect x="432" y="128" width="40" height="22" rx="5" class="bl"/>
    <path class="k" d="M356,139 L372,139 M414,139 L430,139" style="stroke-width:1.6"/>
    <rect x="374" y="170" width="40" height="22" rx="5" class="bl"/>
    <path class="k" d="M394,150 L394,168" style="stroke-width:1.6"/>
    <g class="b"><rect x="324" y="206" width="6" height="14"/><rect x="334" y="200" width="6" height="20"/><rect x="344" y="210" width="6" height="10"/></g>
    <g style="fill:#C9D4FF"><rect x="354" y="204" width="6" height="16"/><rect x="364" y="196" width="6" height="24"/></g>
    <path class="k" d="M430,206 L470,206 M430,216 L458,216" style="stroke:#C9D4FF;stroke-width:4"/>
  </g>

  <!-- circuit lines from the screen -->
  <g class="k" style="stroke-width:1.6">
    <path d="M360,112 L360,64"/><circle cx="360" cy="58" r="6" class="w" style="stroke-width:1.6"/>
    <path d="M384,112 L384,80 L410,54"/><circle cx="414" cy="50" r="6" class="w" style="stroke-width:1.6"/>
    <path d="M408,112 L408,92 L470,40"/><circle cx="475" cy="35" r="6" class="w" style="stroke-width:1.6"/>
    <path d="M490,150 L560,150 L596,112"/><circle cx="600" cy="108" r="6" class="w" style="stroke-width:1.6"/>
    <path d="M490,170 L548,170 L570,190"/><circle cx="574" cy="194" r="6" class="w" style="stroke-width:1.6"/>
    <path d="M490,190 L520,190 L538,212"/><circle cx="541" cy="216" r="6" class="w" style="stroke-width:1.6"/>
  </g>

  <!-- plant on the step -->
  <g>
    <path class="w" d="M556,250 L590,250 L586,282 L560,282 Z"/>
    <path class="w" d="M573,250 C556,232 548,206 560,186 C574,204 578,228 573,250 Z"/>
    <path class="w" d="M574,250 C584,226 602,212 622,214 C618,236 600,250 574,250 Z"/>
    <path class="k" d="M573,250 L562,198 M576,248 L612,220" style="stroke-width:1.4"/>
  </g>

  <!-- the engineer -->
  <g>
    <path d="M60,408 C58,330 92,282 160,268 L240,268 C300,280 330,330 330,408 Z" fill="#4F6EF7" stroke="#1E1E28" stroke-width="2" stroke-linejoin="round"/>
    <path class="k" d="M170,268 L200,300 L230,268" style="stroke:#FFFFFF"/>
    <path class="k" d="M110,330 L104,408 M286,330 L292,408" style="stroke:#1E1E28;stroke-width:1.6"/>
    <rect class="w" x="186" y="236" width="28" height="36" rx="10"/>
    <ellipse class="w" cx="200" cy="208" rx="38" ry="44"/>
    <path class="bk" d="M162,200 C150,160 196,132 226,150 C246,150 252,176 240,192 C228,176 206,172 192,180 C182,186 176,196 170,206 Z"/>
    <path class="k" d="M214,226 C220,230 228,228 232,222" style="stroke-width:1.6"/>
    <!-- arm resting -->
    <path d="M150,330 C176,368 236,380 262,372" fill="none" stroke="#4F6EF7" stroke-width="30" stroke-linecap="round"/>
    <path class="k" d="M150,330 C176,368 236,380 262,372" style="stroke-width:0"/>
    <ellipse class="w" cx="272" cy="368" rx="22" ry="16"/>
  </g>

  <!-- laptop in front, black, with a code badge -->
  <g>
    <path d="M240,408 L300,316 L452,316 L410,408 Z" class="bk"/>
    <path class="k" d="M226,408 L430,408" style="stroke-width:4"/>
    <rect x="430" y="300" width="40" height="40" rx="7" class="b"/>
    <path class="k" d="M444,312 L438,320 L444,328 M456,312 L462,320 L456,328" style="stroke:#FFFFFF;stroke-width:2.4"/>
  </g>

  <!-- a cup of tea -->
  <g>
    <path class="w" d="M486,370 L530,370 L526,402 L490,402 Z"/>
    <path class="k" d="M530,378 C546,378 546,394 528,394"/>
    <path class="k" d="M478,404 L538,404" style="stroke-width:2"/>
  </g>

  <!-- a small gear card on the side wall -->
  <g>
    <rect class="w" x="560" y="316" width="44" height="64" rx="4"/>
    <circle class="b" cx="582" cy="338" r="9"/><circle cx="582" cy="338" r="3.5" fill="#FFFFFF"/>
    <circle class="b" cx="590" cy="362" r="6"/><circle cx="590" cy="362" r="2.4" fill="#FFFFFF"/>
  </g>
</svg>
