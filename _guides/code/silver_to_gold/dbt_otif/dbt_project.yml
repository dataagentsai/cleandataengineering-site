name: dbt_otif
version: "1.0"
profile: dbt_otif
model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
seeds:
  dbt_otif:
    order_lines:
      +column_types: {qty_ordered: integer, promised_date: date, _seq: bigint}
    deliveries:
      +column_types: {qty: integer, delivered_date: date, _seq: bigint}
    dim_dealer:
      +column_types: {dealer_key: integer, valid_from: date, valid_to: date}
    delivery_files:
      +column_types: {file_date: date}
