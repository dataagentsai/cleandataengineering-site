<!doctype html>
<!-- Share card for link previews (LinkedIn, X, Slack). Render with:
     chrome --headless --window-size=1200,630 --screenshot=assets/og-card.png _site/og_card.html -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Patrick+Hand&display=swap">
<style>
  html, body { margin:0; width:1200px; height:630px; background:#fff; overflow:hidden; }
  .card { display:flex; align-items:center; height:630px; padding:0 56px; box-sizing:border-box; gap:24px; }
  .text { flex:1; }
  h1 { font-family:"Patrick Hand",cursive; font-weight:400; font-size:82px; line-height:1; margin:0 0 22px; color:#1F1F1F; }
  p { font-family:"DM Sans",sans-serif; font-size:31px; line-height:1.35; color:#3D3D3D; margin:0 0 30px; }
  .url { font-family:"DM Sans",sans-serif; font-weight:600; font-size:26px; color:#3B4F8F;
         border:1.5px solid #1F1F1F; border-radius:255px 18px 225px 18px/18px 225px 18px 255px; padding:10px 22px; display:inline-block; background:#F1F4FB; }
  img { width:560px; }
</style></head>
<body><div class="card">
  <div class="text">
    <h1>Clean Data Engineering</h1>
    <p>Free, hand-drawn courses and simulators for data, AI and LLM engineers.</p>
    <span class="url">cleandataengineering.ai</span>
  </div>
  <img src="../assets/illustrations/hero-team.svg" alt="">
</div></body></html>
